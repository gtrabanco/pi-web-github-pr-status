name: Publish

# Publicación manual desde la pestaña "Actions" → "Run workflow"
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    if: github.repository == 'gtrabanco/pi-web-github-pr-status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Validate package
        run: bun run scripts/validate-package.ts

      - name: Publish if version changed
        run: |
          PACKAGE_NAME=$(bun -e "console.log(require('./package.json').name)")
          LOCAL_VERSION=$(bun -e "console.log(require('./package.json').version)")

          PUBLISHED_VERSION=$(bunx npm view "$PACKAGE_NAME" version 2>/dev/null || echo "unpublished")

          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "Version $LOCAL_VERSION already published — skipping."
            exit 0
          fi

          echo "Publishing $PACKAGE_NAME@$LOCAL_VERSION (registry has $PUBLISHED_VERSION)..."

          bunx npm@latest publish --access public

          git tag "v$LOCAL_VERSION"
          git push origin "v$LOCAL_VERSION"