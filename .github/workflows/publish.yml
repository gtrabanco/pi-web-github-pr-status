name: Publish

# Publicación manual desde la pestaña "Actions" → "Run workflow"
on:
  workflow_dispatch:
    inputs:
      release-type:
        description: "Tipo de versión a publicar (bump)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    if: github.repository == 'gtrabanco/pi-web-github-pr-status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Validate package
        run: bun run scripts/validate-package.ts

      - name: Compute new version
        id: version
        run: |
          PACKAGE_NAME=$(bun -e "console.log(require('./package.json').name)")
          LOCAL_VERSION=$(bun -e "console.log(require('./package.json').version)")
          RELEASE_TYPE="${{ github.event.inputs.release-type }}"

          NEW_VERSION=$(bun -e "console.log(require('./scripts/semver').computeNextVersion('${LOCAL_VERSION}', '${RELEASE_TYPE}'))")
          PUBLISHED_VERSION=$(bunx npm view "$PACKAGE_NAME@$NEW_VERSION" version 2>/dev/null || true)

          echo "Current: $LOCAL_VERSION"
          echo "Bump: $RELEASE_TYPE"
          echo "Next: $NEW_VERSION"

          # Decide BEFORE touching package.json: a re-run of an already released
          # version must be a no-op, not advance the repository version.
          if [ "$PUBLISHED_VERSION" = "$NEW_VERSION" ]; then
            echo "$NEW_VERSION is already published — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump version, commit and push
        if: steps.version.outputs.skip != 'true'
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          bun -e "
            const pkg = require('./package.json');
            pkg.version = '${NEW_VERSION}';
            require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v${NEW_VERSION}"
          # Keep the repository version in sync with the registry: without this
          # push the next run recomputes the same version and skips forever.
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish
        if: steps.version.outputs.skip != 'true'
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          # --ignore-scripts: package.json must never declare a `publish` script.
          # npm runs scripts named after lifecycle hooks, so `npm publish` would
          # re-enter the release tooling (and its unauthenticated `bun publish`).
          # The tarball is already built by the steps above.
          bunx npm@latest publish --access public --ignore-scripts

          git tag "v${NEW_VERSION}"
          git push origin "v${NEW_VERSION}"